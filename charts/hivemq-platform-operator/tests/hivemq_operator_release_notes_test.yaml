suite: HiveMQ Platform Operator - NOTES tests
templates:
  - NOTES.txt
release:
  name: hivemq-platform-operator-release
  namespace: hivemq-platform-operator-namespace
tests:

  - it: with default values
    asserts:
      - equalRaw:
          value: |
            -----
            HiveMQ Platform Operator release "hivemq-platform-operator-release" installed in namespace "hivemq-platform-operator-namespace"
            
            Documentation can be found here: https://docs.hivemq.com/hivemq-platform-operator/index.html
            -----

  - it: with custom service account, shows warning
    set:
      serviceAccount.create: false
      serviceAccount.name: foo-bar-sa
    asserts:
      - equalRaw:
          value: |
            -----
            HiveMQ Platform Operator release "hivemq-platform-operator-release" installed in namespace "hivemq-platform-operator-namespace"
            
            Documentation can be found here: https://docs.hivemq.com/hivemq-platform-operator/index.html
            
            *** Warning ***
            The ServiceAccount foo-bar-sa should have sufficient permissions for the Operator to work correctly.
            -----

  - it: with platform service account create disabled, shows warning
    set:
      hivemqPlatformServiceAccount.create: false
    asserts:
      - equalRaw:
          value: |
            -----
            HiveMQ Platform Operator release "hivemq-platform-operator-release" installed in namespace "hivemq-platform-operator-namespace"
            
            Documentation can be found here: https://docs.hivemq.com/hivemq-platform-operator/index.html
            
            *** Warning ***
            The Operator is not configured to create a ServiceAccount for the HiveMQ Platform Pods.
            Please make sure that you configure a valid custom ServiceAccount in the HiveMQ Platform Helm charts values.yaml (see nodes.serviceAccountName).
            -----

  - it: with platform service account create and validate disabled
    set:
      hivemqPlatformServiceAccount.permissions.create: false
    asserts:
      - equalRaw:
          value: |
            -----
            HiveMQ Platform Operator release "hivemq-platform-operator-release" installed in namespace "hivemq-platform-operator-namespace"
            
            Documentation can be found here: https://docs.hivemq.com/hivemq-platform-operator/index.html
            
            *** Warning ***
            The Operator is not configured to create the RBAC permissions (Role and RoleBinding) for the ServiceAccount of the HiveMQ Platform Pods.
            Please make sure the HiveMQ Platform Helm charts values.yaml configures a ServiceAccount (see nodes.serviceAccountName) with sufficient RBAC permissions to get, patch and update Pods.
            -----

  - it: with override resource limits, shows warning
    set:
      resources.overrideLimits: {}
    asserts:
      - equalRaw:
          value: |
            -----
            HiveMQ Platform Operator release "hivemq-platform-operator-release" installed in namespace "hivemq-platform-operator-namespace"
            
            Documentation can be found here: https://docs.hivemq.com/hivemq-platform-operator/index.html
            
            *** Warning ***
            `resources.overrideLimits` is not recommended for production use cases and may lead to unpredictable memory and cpu allocation for pods.
            -----

  - it: with platform statefulset rolling-restart-on-template-metadata-change, shows warning
    set:
      hivemqPlatformStatefulSet.rollingRestartOnTemplateMetadataChange: true
    asserts:
      - equalRaw:
          value: |
            -----
            HiveMQ Platform Operator release "hivemq-platform-operator-release" installed in namespace "hivemq-platform-operator-namespace"
            
            Documentation can be found here: https://docs.hivemq.com/hivemq-platform-operator/index.html
            
            *** Warning ***
            `hivemqPlatformStatefulSet.rollingRestartOnTemplateMetadataChange` and its counterpart environment variable `HIVEMQ_PLATFORM_OPERATOR_STATEFULSET_ROLLING_RESTART_ON_TEMPLATE_METADATA_CHANGE` are no longer supported by the Operator.
            -----

  - it: with platform statefulset only, no warning is shown
    set:
      hivemqPlatformStatefulSet: "foobar"
    asserts:
      - equalRaw:
          value: |
            -----
            HiveMQ Platform Operator release "hivemq-platform-operator-release" installed in namespace "hivemq-platform-operator-namespace"
            
            Documentation can be found here: https://docs.hivemq.com/hivemq-platform-operator/index.html
            -----

  - it: with platform statefulset and nested value, no warning is shown
    set:
      hivemqPlatformStatefulSet:
        foobar: "baz"
    asserts:
      - equalRaw:
          value: |
            -----
            HiveMQ Platform Operator release "hivemq-platform-operator-release" installed in namespace "hivemq-platform-operator-namespace"
            
            Documentation can be found here: https://docs.hivemq.com/hivemq-platform-operator/index.html
            -----

  - it: with platform statefulset rolling-restart-on-template-metadata-change EnvVar, shows warning
    set:
      env:
        - name: HIVEMQ_PLATFORM_OPERATOR_STATEFULSET_ROLLING_RESTART_ON_TEMPLATE_METADATA_CHANGE
          value: false
    asserts:
      - equalRaw:
          value: |
            -----
            HiveMQ Platform Operator release "hivemq-platform-operator-release" installed in namespace "hivemq-platform-operator-namespace"
            
            Documentation can be found here: https://docs.hivemq.com/hivemq-platform-operator/index.html
            
            *** Warning ***
            `hivemqPlatformStatefulSet.rollingRestartOnTemplateMetadataChange` and its counterpart environment variable `HIVEMQ_PLATFORM_OPERATOR_STATEFULSET_ROLLING_RESTART_ON_TEMPLATE_METADATA_CHANGE` are no longer supported by the Operator.
            -----

  - it: with deprecated rolling restart last pod min age EnvVar, shows warning
    set:
      env:
        - name: HIVEMQ_PLATFORM_OPERATOR_RECONCILIATION_ROLLING_RESTART_LAST_POD_MIN_AGE_MILLIS
          value: "60000"
    asserts:
      - equalRaw:
          value: |
            -----
            HiveMQ Platform Operator release "hivemq-platform-operator-release" installed in namespace "hivemq-platform-operator-namespace"
            
            Documentation can be found here: https://docs.hivemq.com/hivemq-platform-operator/index.html
            
            *** Warning ***
            The environment variable `HIVEMQ_PLATFORM_OPERATOR_RECONCILIATION_ROLLING_RESTART_LAST_POD_MIN_AGE_MILLIS` is deprecated and will be removed in future releases.
            Please, consider removing it and using the `rollingRestartLastPodReadyMinAgeSeconds` value instead.
            Since HiveMQ Platform Operator 2.3.0, the minimum age is measured from the time the last restarted pod became ready instead of from the time it started.
            A pod becomes ready only after HiveMQ has joined the cluster, including the join data replication, so with the same value a rolling restart waits longer between pods, by up to the configured minimum age per pod.
            -----
