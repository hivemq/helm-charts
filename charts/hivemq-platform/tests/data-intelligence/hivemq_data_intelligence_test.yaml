suite: HiveMQ Platform - Data Intelligence tests
templates:
  - hivemq-custom-resource.yml
release:
  name: test-hivemq-platform
  namespace: test-hivemq-platform-namespace
chart:
  version: 0.0.1
  appVersion: 1.0.0
tests:

  - it: with default values, no Data Intelligence environment variable
    asserts:
      - notContains:
          path: spec.statefulSet.spec.template.spec.containers[0].env
          content:
            name: HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING
          any: true
      - notExists:
          path: spec.statefulSet.spec.template.spec.volumes

  - it: with a connection string Secret, the environment variable is set from the Secret
    set:
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
    asserts:
      - contains:
          path: spec.statefulSet.spec.template.spec.containers[0].env
          content:
            name: HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: my-connection-string-secret
                key: connection-string
      - notExists:
          path: spec.statefulSet.spec.template.spec.volumes

  - it: with a connection string Secret and a custom key, the environment variable uses the custom key
    set:
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
      dataIntelligence.server.connectionStringSecretKey: my-connection-string
    asserts:
      - contains:
          path: spec.statefulSet.spec.template.spec.containers[0].env
          content:
            name: HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: my-connection-string-secret
                key: my-connection-string

  - it: with clustering enabled, no additional StatefulSet changes
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
    asserts:
      - notExists:
          path: spec.statefulSet.spec.podManagementPolicy
      - notExists:
          path: spec.statefulSet.spec.volumeClaimTemplates
      - notContains:
          path: spec.statefulSet.spec.template.spec.containers[0].env
          content:
            name: HIVEMQ_CLUSTERING_INITIAL_MEMBERS
          any: true

  - it: with the retired pulse values, validation fails
    set:
      pulse.create: true
    asserts:
      - failedTemplate:
          errorPattern: "The `pulse` values are retired"

  - it: with clustering enabled without initial member count, validation fails
    set:
      dataIntelligence.clustering.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "`dataIntelligence.clustering.initialMemberCount` value is required"

  - it: with an initial member count greater than the replica count, validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 3
      nodes.replicaCount: 2
    asserts:
      - failedTemplate:
          errorPattern: "cannot be greater than the `nodes.replicaCount` value \\(2\\). Increase `nodes.replicaCount`, or lower `initialMemberCount` before the initial installation"

  - it: with a single initial member and more than one replica, validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 1
      nodes.replicaCount: 2
    asserts:
      - failedTemplate:
          errorPattern: "must be at least 2 when the `nodes.replicaCount` value \\(2\\) is greater than 1"

  - it: with a single initial member and a single replica, no validation error
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 1
      nodes.replicaCount: 1
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with clustering disabled and a single initial member, no validation error
    set:
      dataIntelligence.clustering.enabled: false
      dataIntelligence.clustering.initialMemberCount: 1
    asserts:
      - exists:
          path: spec.statefulSet

  - it: with clustering enabled and a custom HiveMQ configuration override, validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      config.overrideHiveMQConfig: "<hivemq></hivemq>"
    asserts:
      - failedTemplate:
          errorPattern: "cannot be combined with the `config.overrideHiveMQConfig` value"

  - it: with the connection string environment variable set manually, validation fails
    set:
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
      nodes.env:
        - name: HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING
          value: my-connection-string
    asserts:
      - failedTemplate:
          errorPattern: "HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING environment variable cannot be set"

  - it: with the log-based clustering environment variable set manually and clustering enabled, validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      nodes.env:
        - name: HIVEMQ_LOG_BASED_CLUSTERING_ENABLED
          value: "false"
    asserts:
      - failedTemplate:
          errorPattern: "HIVEMQ_LOG_BASED_CLUSTERING_ENABLED environment variable cannot be set when HiveMQ Data Intelligence clustering is enabled"

  - it: with clustering disabled and no initial member count, no validation error
    set:
      dataIntelligence.clustering.enabled: false
    asserts:
      - exists:
          path: spec.statefulSet

  - it: with clustering disabled and an initial member count greater than the replica count, no validation error
    set:
      dataIntelligence.clustering.enabled: false
      dataIntelligence.clustering.initialMemberCount: 5
      nodes.replicaCount: 2
    asserts:
      - exists:
          path: spec.statefulSet

  - it: with clustering disabled and a custom HiveMQ configuration override, no validation error
    set:
      dataIntelligence.clustering.enabled: false
      config.overrideHiveMQConfig: "<hivemq></hivemq>"
    asserts:
      - exists:
          path: spec.statefulSet

  - it: with the connection string environment variable set manually and no connection string Secret, no validation error
    set:
      nodes.env:
        - name: HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING
          value: my-connection-string
    asserts:
      - contains:
          path: spec.statefulSet.spec.template.spec.containers[0].env
          content:
            name: HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING
            value: my-connection-string

  - it: with the log-based clustering environment variable set manually and clustering disabled, the manual override is rendered
    set:
      nodes.env:
        - name: HIVEMQ_LOG_BASED_CLUSTERING_ENABLED
          value: "true"
    asserts:
      - contains:
          path: spec.statefulSet.spec.template.spec.containers[0].env
          content:
            name: HIVEMQ_LOG_BASED_CLUSTERING_ENABLED
            value: "true"

  - it: with an unrelated internal option and a connection string Secret, no validation error
    set:
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
      hivemqInternalOptions:
        - key: foo
          value: bar
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with a custom HiveMQ configuration override and a connection string Secret, the environment variable is still rendered
    set:
      config.overrideHiveMQConfig: "<hivemq></hivemq>"
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
    asserts:
      - contains:
          path: spec.statefulSet.spec.template.spec.containers[0].env
          content:
            name: HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: my-connection-string-secret
                key: connection-string

  - it: with clustering enabled and an overridden StatefulSet, validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      config.overrideStatefulSet: "spec: {}"
    asserts:
      - failedTemplate:
          errorPattern: "cannot be combined with the `config.overrideStatefulSet` value"

  - it: with clustering disabled and an overridden StatefulSet, no validation error
    set:
      dataIntelligence.clustering.enabled: false
      config.overrideStatefulSet: "spec: {}"
    asserts:
      - notFailedTemplate: {}

  - it: with clustering enabled and an existing HiveMQ configuration, validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      config.create: false
      config.name: my-existing-config
    asserts:
      - failedTemplate:
          errorPattern: "cannot be combined with the `config.create=false` value"

  - it: with clustering disabled and an existing HiveMQ configuration, no validation error
    set:
      dataIntelligence.clustering.enabled: false
      config.create: false
      config.name: my-existing-config
    asserts:
      - notFailedTemplate: {}

  - it: with a clustering port clashing with the cluster transport port, validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      dataIntelligence.clustering.port: 7000
    asserts:
      - failedTemplate:
          errorPattern: "already exists as part of one of the predefined ports"

  - it: with an exposed service on the clustering port, validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      services:
        - type: mqtt
          exposed: true
          containerPort: 7557
    asserts:
      - failedTemplate:
          errorPattern: "already exists as the container port of the exposed service type `mqtt`"

  - it: with a connection string Secret, the Secret is automatically monitored
    set:
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
    asserts:
      - contains:
          path: spec.monitoredResources
          content:
            name: my-connection-string-secret
            type: SECRET
            files:
              - connection-string

  - it: with the connection string Secret listed in the monitored resources, validation fails
    set:
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
      monitoredResources:
        - name: my-connection-string-secret
          type: Secret
    asserts:
      - failedTemplate:
          errorPattern: "is automatically monitored"

  - it: with the retired pulse create value disabled, no validation error
    set:
      pulse.create: false
    asserts:
      - notFailedTemplate: {}

  - it: with the retired pulse name value, validation fails
    set:
      pulse.name: my-pulse-secret
    asserts:
      - failedTemplate:
          errorPattern: "The `pulse` values are retired"

  - it: with clustering enabled and a release name longer than 48 characters, validation fails
    release:
      name: release-name-longer-than-forty-eight-characters-x
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
    asserts:
      - failedTemplate:
          errorPattern: "exceeds 48 characters"

  - it: with an out-of-range clustering port, schema validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      dataIntelligence.clustering.port: 70000
    asserts:
      - failedTemplate: {}

  - it: with a zero initial member count, schema validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 0
    asserts:
      - failedTemplate: {}

  - it: with an unknown clustering value, schema validation fails
    set:
      dataIntelligence.clustering.enable: true
    asserts:
      - failedTemplate: {}

  - it: with an unknown server value, schema validation fails
    set:
      dataIntelligence.server.connectionString: my-connection-string
    asserts:
      - failedTemplate: {}

  - it: with clustering enabled and a release name of exactly 48 characters, no validation error
    release:
      name: release-name-with-exactly-forty-eight-characters
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
    asserts:
      - notFailedTemplate: {}

  - it: with clustering disabled and a release name longer than 48 characters, no validation error
    release:
      name: release-name-longer-than-forty-eight-characters-x
    set:
      dataIntelligence.clustering.enabled: false
    asserts:
      - notFailedTemplate: {}

  - it: with the retired pulse data value, validation fails
    set:
      pulse.data: "PHB1bHNlPjwvcHVsc2U+"
    asserts:
      - failedTemplate:
          errorPattern: "The `pulse` values are retired"

  - it: with the retired pulse override config value, validation fails
    set:
      pulse.overridePulseConfig: "<pulse></pulse>"
    asserts:
      - failedTemplate:
          errorPattern: "The `pulse` values are retired"

  - it: with clustering disabled and an exposed service on the clustering port, no validation error
    set:
      dataIntelligence.clustering.enabled: false
      services:
        - type: mqtt
          exposed: true
          containerPort: 7557
    asserts:
      - notFailedTemplate: {}

  - it: with the connection string Secret and an unrelated monitored resource, both are rendered
    set:
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
      monitoredResources:
        - name: my-other-secret
          type: Secret
    asserts:
      - contains:
          path: spec.monitoredResources
          content:
            name: my-connection-string-secret
            type: SECRET
            files:
              - connection-string
      - contains:
          path: spec.monitoredResources
          content:
            name: my-other-secret
            type: SECRET

  - it: with a connection string Secret key containing invalid characters, schema validation fails
    set:
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
      dataIntelligence.server.connectionStringSecretKey: "invalid/key"
    asserts:
      - failedTemplate: {}

  - it: with an unknown Data Intelligence value, schema validation fails
    set:
      dataIntelligence.cluster.enabled: true
    asserts:
      - failedTemplate: {}

  - it: with a zero connect timeout, schema validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      dataIntelligence.clustering.initialMembersConnectTimeoutSeconds: 0
    asserts:
      - failedTemplate:
          errorPattern: "initialMembersConnectTimeoutSeconds"

  - it: with a changed initial member count on an existing installation, validation fails
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: hivemq-configuration-test-hivemq-platform
            namespace: test-hivemq-platform-namespace
          data:
            config.xml: "<hivemq><cluster><log-based><initial-members><member><host>a</host></member><member><host>b</host></member></initial-members></log-based></cluster></hivemq>"
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 3
      nodes.replicaCount: 3
    asserts:
      - failedTemplate:
          errorPattern: "cannot be changed on an existing installation \\(deployed with 2 initial members\\)"

  - it: with an unchanged initial member count on an existing installation, no validation error
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: hivemq-configuration-test-hivemq-platform
            namespace: test-hivemq-platform-namespace
          data:
            config.xml: "<hivemq><cluster><log-based><initial-members><member><host>a</host></member><member><host>b</host></member></initial-members></log-based></cluster></hivemq>"
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with clustering enabled for the first time on an existing installation, no validation error
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: hivemq-configuration-test-hivemq-platform
            namespace: test-hivemq-platform-namespace
          data:
            config.xml: "<hivemq><cluster><enabled>true</enabled></cluster></hivemq>"
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with a changed initial member count against a deployed Secret configuration, validation fails
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: hivemq-configuration-test-hivemq-platform
            namespace: test-hivemq-platform-namespace
          data:
            config.xml: "PGhpdmVtcT48Y2x1c3Rlcj48bG9nLWJhc2VkPjxpbml0aWFsLW1lbWJlcnM+PG1lbWJlcj48aG9zdD5hPC9ob3N0PjwvbWVtYmVyPjxtZW1iZXI+PGhvc3Q+YjwvaG9zdD48L21lbWJlcj48L2luaXRpYWwtbWVtYmVycz48L2xvZy1iYXNlZD48L2NsdXN0ZXI+PC9oaXZlbXE+"
    set:
      config.createAs: Secret
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 3
      nodes.replicaCount: 3
    asserts:
      - failedTemplate:
          errorPattern: "cannot be changed on an existing installation \\(deployed with 2 initial members\\)"

  - it: with clustering disabled on an existing clustered installation, validation fails
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: hivemq-configuration-test-hivemq-platform
            namespace: test-hivemq-platform-namespace
          data:
            config.xml: "<hivemq><cluster><log-based><enabled>true</enabled><initial-members><member><host>a</host></member><member><host>b</host></member></initial-members></log-based></cluster></hivemq>"
    asserts:
      - failedTemplate:
          errorPattern: "clustering cannot be disabled on an existing installation"

  - it: with clustering disabled and a deployed configuration without clustering, no validation error
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: hivemq-configuration-test-hivemq-platform
            namespace: test-hivemq-platform-namespace
          data:
            config.xml: "<hivemq><cluster><enabled>true</enabled></cluster></hivemq>"
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with clustering disabled, a clustered deployed configuration and a configuration override, no validation error
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: hivemq-configuration-test-hivemq-platform
            namespace: test-hivemq-platform-namespace
          data:
            config.xml: "<hivemq><cluster><log-based><enabled>true</enabled><initial-members><member><host>a</host></member><member><host>b</host></member></initial-members></log-based></cluster></hivemq>"
    set:
      config.overrideHiveMQConfig: "<hivemq></hivemq>"
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with clustering disabled, a clustered deployed configuration and an existing HiveMQ configuration, no validation error
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: my-existing-configuration
            namespace: test-hivemq-platform-namespace
          data:
            config.xml: "<hivemq><cluster><log-based><enabled>true</enabled><initial-members><member><host>a</host></member><member><host>b</host></member></initial-members></log-based></cluster></hivemq>"
    set:
      config.create: false
      config.name: my-existing-configuration
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with a connection string Secret and an overridden StatefulSet without the environment variable, validation fails
    set:
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
      config.overrideStatefulSet: "spec: {}"
    asserts:
      - failedTemplate:
          errorPattern: "which the `config.overrideStatefulSet` value does not define"

  - it: with a connection string Secret and an overridden StatefulSet defining the environment variable, no validation error
    set:
      dataIntelligence.server.connectionStringSecretName: my-connection-string-secret
      config.overrideStatefulSet: |
        spec:
          template:
            spec:
              containers:
                - name: hivemq
                  env:
                    - name: HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING
                      valueFrom:
                        secretKeyRef:
                          name: my-connection-string-secret
                          key: connection-string
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with a null dataIntelligence value, no rendering error
    set:
      dataIntelligence: null
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with a null clustering value, no rendering error
    set:
      dataIntelligence.clustering: null
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with a null server value, no rendering error
    set:
      dataIntelligence.server: null
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with the clustering port clashing with the metrics port, validation fails
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      dataIntelligence.clustering.port: 9399
    asserts:
      - failedTemplate:
          errorPattern: "already exists as part of one of the predefined ports \\(7979, 8889, 7000, 9399\\)"

  - it: with a stale deployed ConfigMap next to the current Secret configuration, the Secret wins
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: "v1"
            resource: "configmaps"
          namespaced: true
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: hivemq-configuration-test-hivemq-platform
            namespace: test-hivemq-platform-namespace
          data:
            config.xml: "<hivemq><cluster><log-based><initial-members><member><host>a</host></member><member><host>b</host></member><member><host>c</host></member></initial-members></log-based></cluster></hivemq>"
        - apiVersion: v1
          kind: Secret
          metadata:
            name: hivemq-configuration-test-hivemq-platform
            namespace: test-hivemq-platform-namespace
          data:
            config.xml: "PGhpdmVtcT48Y2x1c3Rlcj48bG9nLWJhc2VkPjxpbml0aWFsLW1lbWJlcnM+PG1lbWJlcj48aG9zdD5hPC9ob3N0PjwvbWVtYmVyPjxtZW1iZXI+PGhvc3Q+YjwvaG9zdD48L21lbWJlcj48L2luaXRpYWwtbWVtYmVycz48L2xvZy1iYXNlZD48L2NsdXN0ZXI+PC9oaXZlbXE+"
    set:
      config.createAs: Secret
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1

  - it: with a blank connection string Secret name, schema validation fails
    set:
      dataIntelligence.server.connectionStringSecretName: " "
    asserts:
      - failedTemplate:
          errorPattern: "connectionStringSecretName"
