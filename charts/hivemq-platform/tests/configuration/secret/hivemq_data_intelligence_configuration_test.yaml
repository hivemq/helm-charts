suite: HiveMQ Platform Configuration as Secret - Data Intelligence tests
templates:
  - hivemq-configuration.yml
release:
  name: test-hivemq-platform
  namespace: test-hivemq-platform-namespace
chart:
  version: 0.0.1
  appVersion: 1.0.0
set:
  config.createAs: Secret
asserts:
  - containsDocument:
    apiVersion: v1
    kind: Secret
    name: hivemq-configuration-test-hivemq-platform
    namespace: test-hivemq-platform-namespace
    template: hivemq-configuration.yml
tests:

  - it: with default values, no Data Intelligence configuration
    asserts:
      - exists:
          path: data["config.xml"]
      - notMatchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<log-based>.*?</log-based>"
      - notMatchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<data-intelligence>.*?</data-intelligence>"

  - it: with clustering disabled explicitly, no log-based clustering configuration
    set:
      dataIntelligence.clustering.enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<log-based>.*?</log-based>"

  - it: with clustering enabled, log-based clustering with the default port and the initial member list
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
    asserts:
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<cluster>.*?<log-based>.*?<enabled>true</enabled>.*?<bind-port>7557</bind-port>.*?</log-based>.*?</cluster>"
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<initial-members>.*?<member>.*?<host>test-hivemq-platform-0.hivemq-test-hivemq-platform-cluster.test-hivemq-platform-namespace.svc</host>.*?<port>7557</port>.*?</member>.*?<member>.*?<host>test-hivemq-platform-1.hivemq-test-hivemq-platform-cluster.test-hivemq-platform-namespace.svc</host>.*?<port>7557</port>.*?</member>.*?</initial-members>"
      - notMatchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "<host>test-hivemq-platform-2."
      - notMatchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "<data-layer-enabled>"

  - it: with clustering enabled and a custom port, log-based clustering with the custom port
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      dataIntelligence.clustering.port: 7600
    asserts:
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<log-based>.*?<bind-port>7600</bind-port>.*?</log-based>"
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<member>.*?<port>7600</port>.*?</member>"

  - it: with clustering enabled and the data layer disabled, log-based clustering without the data layer
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      dataIntelligence.clustering.dataLayerEnabled: false
    asserts:
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<log-based>.*?<enabled>true</enabled>.*?<data-layer-enabled>false</data-layer-enabled>.*?</log-based>"

  - it: with clustering enabled and the data layer enabled explicitly, log-based clustering with the default data layer
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      dataIntelligence.clustering.dataLayerEnabled: true
    asserts:
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<log-based>.*?<enabled>true</enabled>.*?</log-based>"
      - notMatchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "<data-layer-enabled>"

  - it: with an agent connection string Secret, the connection string is injected via environment substitution
    set:
      dataIntelligence.agent.connectionStringSecretName: my-connection-string-secret
    asserts:
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<data-intelligence>.*?<agent>.*?<connection-string>\\$\\{HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING\\}</connection-string>.*?</agent>.*?</data-intelligence>"
      - notMatchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "<truststore-path>"

  - it: with an agent truststore Secret, the truststore path points to the mounted Secret
    set:
      dataIntelligence.agent.truststoreSecretName: my-truststore-secret
    asserts:
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<data-intelligence>.*?<agent>.*?<truststore-path>/opt/hivemq/conf/data-intelligence/truststore.jks</truststore-path>.*?</agent>.*?</data-intelligence>"
      - notMatchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "<connection-string>"

  - it: with an agent truststore Secret and a custom key, the truststore path uses the custom key
    set:
      dataIntelligence.agent.truststoreSecretName: my-truststore-secret
      dataIntelligence.agent.truststoreSecretKey: my-truststore.p12
    asserts:
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "<truststore-path>/opt/hivemq/conf/data-intelligence/my-truststore.p12</truststore-path>"

  - it: with an agent connection string and truststore Secret, both agent options are rendered
    set:
      dataIntelligence.agent.connectionStringSecretName: my-connection-string-secret
      dataIntelligence.agent.truststoreSecretName: my-truststore-secret
    asserts:
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<data-intelligence>.*?<agent>.*?<connection-string>\\$\\{HIVEMQ_DATA_INTELLIGENCE_CONNECTION_STRING\\}</connection-string>.*?<truststore-path>/opt/hivemq/conf/data-intelligence/truststore.jks</truststore-path>.*?</agent>.*?</data-intelligence>"

  - it: with clustering and agent configured, both blocks are rendered
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 2
      dataIntelligence.agent.connectionStringSecretName: my-connection-string-secret
    asserts:
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<log-based>.*?</log-based>"
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<data-intelligence>.*?</data-intelligence>"

  - it: with clustering enabled and a single initial member, one member is rendered
    set:
      dataIntelligence.clustering.enabled: true
      dataIntelligence.clustering.initialMemberCount: 1
    asserts:
      - matchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "(?s)<initial-members>.*?<host>test-hivemq-platform-0.hivemq-test-hivemq-platform-cluster.test-hivemq-platform-namespace.svc</host>.*?</initial-members>"
      - notMatchRegex:
          path: data["config.xml"]
          decodeBase64: true
          pattern: "<host>test-hivemq-platform-1."
