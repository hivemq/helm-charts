suite: HiveMQ Platform - Rolling Restart Configuration tests
templates:
  - hivemq-custom-resource.yml
release:
  name: test-hivemq-platform
chart:
  version: 0.0.1
tests:

  - it: should not render rollingRestart field when not defined
    asserts:
      - notExists:
          path: spec.rollingRestart

  - it: should not render rollingRestart field when empty object
    set:
      rollingRestart: {}
    asserts:
      - notExists:
          path: spec.rollingRestart

  - it: should render rollingRestart with lastPodReadyMinAgeSeconds
    set:
      rollingRestart:
        lastPodReadyMinAgeSeconds: 300
    asserts:
      - exists:
          path: spec.rollingRestart
      - equal:
          path: spec.rollingRestart.lastPodReadyMinAgeSeconds
          value: 300
      - notExists:
          path: spec.rollingRestart.lastPodMinAgeSeconds

  - it: should render rollingRestart with lastPodReadyMinAgeSeconds set to zero
    set:
      rollingRestart:
        lastPodReadyMinAgeSeconds: 0
    asserts:
      - exists:
          path: spec.rollingRestart
      - equal:
          path: spec.rollingRestart.lastPodReadyMinAgeSeconds
          value: 0

  - it: should fail when lastPodReadyMinAgeSeconds is negative
    set:
      rollingRestart:
        lastPodReadyMinAgeSeconds: -1
    asserts:
      - failedTemplate: {}

  - it: should render deprecated lastPodMinAgeSeconds as lastPodReadyMinAgeSeconds
    set:
      rollingRestart:
        lastPodMinAgeSeconds: 300
    asserts:
      - exists:
          path: spec.rollingRestart
      - equal:
          path: spec.rollingRestart.lastPodReadyMinAgeSeconds
          value: 300
      - notExists:
          path: spec.rollingRestart.lastPodMinAgeSeconds

  - it: should render deprecated lastPodMinAgeSeconds set to zero as lastPodReadyMinAgeSeconds
    set:
      rollingRestart:
        lastPodMinAgeSeconds: 0
    asserts:
      - exists:
          path: spec.rollingRestart
      - equal:
          path: spec.rollingRestart.lastPodReadyMinAgeSeconds
          value: 0
      - notExists:
          path: spec.rollingRestart.lastPodMinAgeSeconds

  - it: should fail when lastPodMinAgeSeconds is negative
    set:
      rollingRestart:
        lastPodMinAgeSeconds: -1
    asserts:
      - failedTemplate: {}

  - it: should render lastPodReadyMinAgeSeconds when both fields are set
    set:
      rollingRestart:
        lastPodReadyMinAgeSeconds: 300
        lastPodMinAgeSeconds: 120
    asserts:
      - exists:
          path: spec.rollingRestart
      - equal:
          path: spec.rollingRestart.lastPodReadyMinAgeSeconds
          value: 300
      - notExists:
          path: spec.rollingRestart.lastPodMinAgeSeconds
