#file: noinspection UndefinedAction,UndefinedParamsPresent
name: HiveMQ Platform Operator Helm Chart and HiveMQ Platform Helm Chart Integration Tests
on:
  workflow_call:
env:
  check-prefix: 'Test #'
  split-total: 25
  CI_RUN: true
jobs:
  generate-split-index-json:
    name: Generate split Platform integration tests indexes
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.generate.outputs.split-index-json }}
    steps:
      - name: Generate split index list
        id: generate
        uses: donnerbart/split-tests-java-action/generate-split-index-json@9f2318c1a0b2576431fe4fa5d030c8557c8c2b91 # v1
        with:
          split-total: ${{ env.split-total }}

  compile-integration-test:
    name: Compile Platform integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HiveMQ Helm Charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: helm-charts
          fetch-depth: 0

      - name: Checkout HiveMQ Platform Operator
        uses: ./helm-charts/.github/actions/checkout-repo
        with:
          repository: hivemq/hivemq-platform-operator
          repository-default-branch: master
          path: hivemq-platform-operator
          token: ${{ secrets.JENKINS_GITHUB_TOKEN }}

      - name: Set up JDK 25
        id: setup-java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          cache: gradle
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-disabled: true

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cicd-harvester

      - name: Configure AWS credentials for ECR Public
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::691852750577:role/ecr-gha-public-pull
          aws-region: us-east-1

      # the included hivemq-platform-operator build pulls its base image from ECR Public; authenticated pulls lift
      # the anonymous 1/s cap that parallel jobs hit
      - name: Log in to ECR Public
        run: |
          password=$(aws ecr-public get-login-password --region us-east-1)
          echo "::add-mask::$password"
          echo "ORG_GRADLE_PROJECT_ecrPublicUsername=AWS" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ecrPublicPassword=$password" >> "$GITHUB_ENV"

      - name: Warmup Gradle cache
        if: steps.setup-java.outputs.cache-hit == 'false'
        working-directory: helm-charts
        env:
          ORG_GRADLE_PROJECT_dockerHubUsername: ${{ secrets.DOCKER_USERNAME }}
          ORG_GRADLE_PROJECT_dockerHubPassword: ${{ secrets.DOCKER_TOKEN }}
          DEVELOCITY_SERVER_URL: ${{ secrets.DEVELOCITY_SERVER_URL }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: ./gradlew :tests-hivemq-platform-operator:integrationTestPrepare

  run-integration-tests:
    name: "Test #${{ matrix.split-index }} (${{ matrix.k8s-version-type }})"
    runs-on: ubuntu-latest
    needs:
      - generate-split-index-json
      - compile-integration-test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        split-index: ${{ fromjson(needs.generate-split-index-json.outputs.json) }}
        k8s-version-type: [
          MINIMUM,
          LATEST
        ]
    steps:
      - name: Checkout HiveMQ Helm Charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: helm-charts
          fetch-depth: 0

      - name: Checkout HiveMQ Platform Operator
        uses: ./helm-charts/.github/actions/checkout-repo
        with:
          repository: hivemq/hivemq-platform-operator
          repository-default-branch: master
          path: hivemq-platform-operator
          token: ${{ secrets.JENKINS_GITHUB_TOKEN }}

      - name: Checkout JUnit reports
        uses: donnerbart/split-tests-java-action/checkout-junit-reports@9f2318c1a0b2576431fe4fa5d030c8557c8c2b91 # v1
        with:
          split-index: ${{ matrix.split-index }}
          git-branch: junit-reports/platform/${{ github.base_ref }}
          path: junit-reports
          artifact-name: junit-reports-sha-platform
          upload-artifact: ${{ matrix.k8s-version-type == 'LATEST' }}

      - name: Set up JDK 25
        id: setup-java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          cache: gradle
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-disabled: true

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cicd-harvester

      - name: Configure AWS credentials for ECR Public
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::691852750577:role/ecr-gha-public-pull
          aws-region: us-east-1

      # the included hivemq-platform-operator build pulls its base image from ECR Public; authenticated pulls lift
      # the anonymous 1/s cap that parallel jobs hit
      - name: Log in to ECR Public
        run: |
          password=$(aws ecr-public get-login-password --region us-east-1)
          echo "::add-mask::$password"
          echo "ORG_GRADLE_PROJECT_ecrPublicUsername=AWS" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ecrPublicPassword=$password" >> "$GITHUB_ENV"

      - name: Compile integration tests
        working-directory: helm-charts
        env:
          ORG_GRADLE_PROJECT_dockerHubUsername: ${{ secrets.DOCKER_USERNAME }}
          ORG_GRADLE_PROJECT_dockerHubPassword: ${{ secrets.DOCKER_TOKEN }}
          K8S_VERSION_TYPE: ${{ matrix.k8s-version-type }}
          DEVELOCITY_SERVER_URL: ${{ secrets.DEVELOCITY_SERVER_URL }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: ./gradlew :tests-hivemq-platform-operator:integrationTestPrepare

      - name: Split tests
        id: split-tests
        uses: donnerbart/split-tests-java-action@9f2318c1a0b2576431fe4fa5d030c8557c8c2b91 # v1
        with:
          split-index: ${{ matrix.split-index }}
          split-total: ${{ env.split-total }}
          glob: '**/helm-charts/tests-hivemq-platform-operator/**/*{IT,Test}.java'
          junit-glob: '**/junit-reports/*.xml'
          format: 'gradle'
          new-test-time: 'average'
          calculate-optimal-total-split: true
          debug: true

      - name: Network state before tests
        run: bash helm-charts/.github/scripts/network-state.sh before

      - name: Run integration tests
        working-directory: helm-charts
        env:
          ORG_GRADLE_PROJECT_dockerHubUsername: ${{ secrets.DOCKER_USERNAME }}
          ORG_GRADLE_PROJECT_dockerHubPassword: ${{ secrets.DOCKER_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
          K8S_VERSION_TYPE: ${{ matrix.k8s-version-type }}
          DEVELOCITY_SERVER_URL: ${{ secrets.DEVELOCITY_SERVER_URL }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          # make testcontainers getHost() return the 127.0.0.1 literal instead of the name "localhost", so the shared
          # fabric8 client connects to the k3s API by IP and never does a getaddrinfo, which can stall under a runtime
          # stall and freeze every HTTP thread on the JVM's per-host DNS lock
          TESTCONTAINERS_HOST_OVERRIDE: 127.0.0.1
        run: ./gradlew :tests-hivemq-platform-operator:integrationTest ${{ steps.split-tests.outputs.test-suite }}

      # only on a non-success run: a healthy run keeps the resolver working, so the built-in post-step
      # logout is fine and keeps the tailnet clean. A runtime stall wedges the resolver and either
      # fails the test step or trips timeout-minutes (a cancel, where failure() is false), so gate on
      # both. cancelled()-gated steps still run during the cancellation window.
      - name: Capture the network state and log out of Tailscale after failed tests
        if: ${{ failure() || cancelled() }}
        uses: ./helm-charts/.github/actions/after-failed-tests

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "HiveMQ Platform Operator - Integration test results #${{ matrix.split-index }} (${{ matrix.k8s-version-type }})"
          path: |
            helm-charts/tests-hivemq-platform-operator/build/reports/tests/integrationTest/
            helm-charts/tests-hivemq-platform-operator/build/test-results/integrationTest/*.xml
          retention-days: 5

      - name: Upload JUnit report artifact
        if: matrix.k8s-version-type == 'LATEST'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit-xml-reports-platform-${{ matrix.split-index }}
          path: |
            helm-charts/tests-hivemq-platform-operator/build/test-results/integrationTest/*.xml

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Integration tests report
          path: '**/build/test-results/integrationTest/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          working-directory: helm-charts

      - name: Install xmllint
        if: failure()
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Set annotations for failed tests
        if: failure()
        run: |
          find helm-charts/tests-hivemq-platform-operator/build/test-results/integrationTest -type f -name "*.xml" | while read -r FILE; do
            COUNT=$(xmllint --xpath 'count(//testcase[failure or error])' "$FILE")
            for INDEX in $(seq 1 "$COUNT"); do
              TEST_CLASS=$(xmllint --xpath "string((//testcase[failure or error])[$INDEX]/@classname)" "$FILE" 2>/dev/null)
              TEST_METHOD=$(xmllint --xpath "string((//testcase[failure or error])[$INDEX]/@name)" "$FILE" 2>/dev/null)
              MESSAGE=$(xmllint --xpath "string((//testcase[failure or error])[$INDEX]/failure/@message | (//testcase[failure or error])[$INDEX]/error/@message)" "$FILE" 2>/dev/null)
              [ -z "$MESSAGE" ] && MESSAGE="Test failed"
              echo "::error title=Test #${{ matrix.split-index }}::$TEST_CLASS.$TEST_METHOD%0A$MESSAGE"
            done
          done

  collect-cancelled-logs:
    name: Collect logs from cancelled Platform integration test jobs
    runs-on: ubuntu-latest
    needs: run-integration-tests
    if: always() && needs.run-integration-tests.result != 'success'
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout HiveMQ Helm Charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: helm-charts
          sparse-checkout: .github/actions

      - name: Collect the logs of the canceled jobs
        uses: ./helm-charts/.github/actions/collect-cancelled-logs
        with:
          artifact-name: "HiveMQ Platform Operator - Logs of cancelled jobs"

  merge-junit-reports:
    name: Merge Platform Operator JUnit reports
    runs-on: ubuntu-latest
    needs:
      - run-integration-tests
    permissions:
      contents: write
    steps:
      - name: Merge JUnit reports
        uses: donnerbart/split-tests-java-action/merge-junit-reports@9f2318c1a0b2576431fe4fa5d030c8557c8c2b91 # v1
        with:
          git-branch: junit-reports/platform/${{ github.base_ref }}
          artifact-name: merged-junit-xml-reports-platform-${{ github.base_ref }}
          split-artifact-pattern: junit-xml-reports-platform-*
