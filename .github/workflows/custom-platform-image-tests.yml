#file: noinspection UndefinedAction,UndefinedParamsPresent,GithubFunctionSignatureValidation
#
# Smoke test of the HiveMQ Platform on different operating systems and Java runtimes. It runs a subset of the HiveMQ
# Platform integration tests against HiveMQ Platform images that are built for the test run.
#
# It shows that HiveMQ runs on a combination, nothing more, and is not a certification of it.
name: HiveMQ Platform Custom Image Tests
on:
  schedule:
    # every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Custom platform image variant to test, all variants if empty'
        required: false
        type: string
concurrency:
  group: custom-platform-image-tests
env:
  CI_RUN: true
permissions:
  contents: read
  checks: write
jobs:
  generate-variants-json:
    name: Generate custom platform image variants
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.generate.outputs.variants-json }}
    steps:
      - name: Checkout HiveMQ Helm Charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          cache: gradle
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-disabled: true

      - name: Generate variant list
        id: generate
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          variants=$(./gradlew :tests-hivemq-platform-operator:printCustomPlatformImageVariants -q --console=plain | grep -oE '^\[.*\]$' | tail -1)
          if [[ -n "$VARIANT" ]]; then
            if [[ "$variants" != *"\"$VARIANT\""* ]]; then
              echo "::error::Unknown custom platform image variant '$VARIANT', expected one of $variants"
              exit 1
            fi
            variants="[\"$VARIANT\"]"
          fi
          echo "variants-json=$variants" >> "$GITHUB_OUTPUT"
          echo "Testing the variants $variants" >> "$GITHUB_STEP_SUMMARY"

  run-integration-tests:
    name: "Test ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    needs: generate-variants-json
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromjson(needs.generate-variants-json.outputs.json) }}
    steps:
      - name: Checkout HiveMQ Helm Charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: helm-charts

      - name: Checkout HiveMQ Platform Operator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: hivemq/hivemq-platform-operator
          path: hivemq-platform-operator
          token: ${{ secrets.JENKINS_GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          cache: gradle
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-disabled: true

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cicd-harvester

      - name: Run integration tests
        working-directory: helm-charts
        env:
          ORG_GRADLE_PROJECT_dockerHubUsername: ${{ secrets.DOCKER_USERNAME }}
          ORG_GRADLE_PROJECT_dockerHubPassword: ${{ secrets.DOCKER_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
          K8S_VERSION_TYPE: LATEST
          DEVELOCITY_SERVER_URL: ${{ secrets.DEVELOCITY_SERVER_URL }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: >
          ./gradlew :tests-hivemq-platform-operator:integrationTest -PcustomPlatformImageVariant=${{ matrix.variant }}

      - name: Add the tested HiveMQ Platform version to the summary
        if: ${{ !cancelled() }}
        env:
          DISTRIBUTION_ZIP: helm-charts/tests-hivemq-platform-operator/build/platform/hivemq-latest.zip
        run: |
          if [[ -f "$DISTRIBUTION_ZIP" ]]; then
            # the distribution unpacks into a hivemq-<version> directory, which is the version that was tested
            version=$(unzip -Z1 "$DISTRIBUTION_ZIP" | head -1 | sed 's|^hivemq-||;s|/$||')
            echo "${{ matrix.variant }}: HiveMQ Platform $version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "${{ matrix.variant }}: the HiveMQ Platform distribution was not downloaded" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "HiveMQ Platform custom image - Integration test results (${{ matrix.variant }})"
          path: |
            helm-charts/tests-hivemq-platform-operator/build/reports/tests/integrationTest/
            helm-charts/tests-hivemq-platform-operator/build/test-results/integrationTest/*.xml
          retention-days: 5

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: "Integration tests report (${{ matrix.variant }})"
          path: '**/build/test-results/integrationTest/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          working-directory: helm-charts

      - name: Install xmllint
        if: failure()
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Set annotations for failed tests
        if: failure()
        run: |
          find helm-charts/tests-hivemq-platform-operator/build/test-results/integrationTest -type f -name "*.xml" | while read -r FILE; do
            COUNT=$(xmllint --xpath 'count(//testcase[failure or error])' "$FILE")
            for INDEX in $(seq 1 "$COUNT"); do
              TEST_CLASS=$(xmllint --xpath "string((//testcase[failure or error])[$INDEX]/@classname)" "$FILE" 2>/dev/null)
              TEST_METHOD=$(xmllint --xpath "string((//testcase[failure or error])[$INDEX]/@name)" "$FILE" 2>/dev/null)
              MESSAGE=$(xmllint --xpath "string((//testcase[failure or error])[$INDEX]/failure/@message | (//testcase[failure or error])[$INDEX]/error/@message)" "$FILE" 2>/dev/null)
              [ -z "$MESSAGE" ] && MESSAGE="Test failed"
              echo "::error title=${{ matrix.variant }}::$TEST_CLASS.$TEST_METHOD%0A$MESSAGE"
            done
          done
